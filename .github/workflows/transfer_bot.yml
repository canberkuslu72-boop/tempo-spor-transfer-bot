
name: Transfer Haberi Filtre Botu

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python transfer_bot.py

      - name: Gönderilen linkleri kaydet
        run: |
          git config user.name "transfer-bot"
          git config user.email "transfer-bot@users.noreply.github.com"
          git add sent_links.json
          git diff --staged --quiet || git commit -m "sent_links.json güncellendi [skip ci]"
          git push
